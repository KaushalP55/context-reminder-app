<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Context Reminder Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 500px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 24px; margin-bottom: 20px; color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    input:focus { outline: none; border-color: #2563eb; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
    .status.success { background: #d1fae5; color: #065f46; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
    .info { margin-top: 20px; padding: 15px; background: #f0f9ff; border-left: 4px solid #2563eb; border-radius: 6px; font-size: 13px; color: #1e40af; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Settings</h1>
    <div class="form-group">
      <label for="userId">User ID</label>
      <input type="text" id="userId" placeholder="Paste your User ID from the web app" />
    </div>
    <button id="saveBtn">Save Settings</button>
    <div id="status" class="status"></div>
    <div class="info">
      <strong>How to get your User ID:</strong><br>
      1. Go to your Context Reminder web app<br>
      2. Sign in to your account<br>
      3. Copy your User ID displayed on the page<br>
      4. Paste it above and click Save<br><br>
      <strong>Note:</strong> App monitoring runs automatically every 0.5 seconds
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
