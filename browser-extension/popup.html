<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #1e40af;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .connected {
      background: #f0fdf4;
      border: 1px solid #86efac;
      color: #166534;
    }
    .disconnected {
      background: #fef3c7;
      border: 1px solid #fbbf24;
      color: #92400e;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h2>🌐 Website Reminders</h2>
  
  <div id="status" class="status disconnected">
    Not connected
  </div>
  
  <div id="loginSection">
    <input type="text" id="userId" placeholder="Enter your User ID">
    <button id="connectBtn">Connect</button>
  </div>
  
  <div id="connectedSection" style="display: none;">
    <button id="disconnectBtn">Disconnect</button>
  </div>
  
  <div class="info">
    Get your User ID from your Context Reminders app settings.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
